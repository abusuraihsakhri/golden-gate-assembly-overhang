name: Test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dependencies
        run: python -m pip install -e '.[server,test]'
      - name: Compile Python
        run: python -m compileall -q agents golden_gate_agent cli.py enrichment.py
      - name: Test Python
        run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate browser scripts
        run: |
          node --check overhang.js
          node --check app.js
      - name: Test browser algorithm
        run: node --test tests/overhang.test.cjs
