version: '3.8'

services:
  golden-gate-assembly-overhang:
    build: .
    container_name: golden-gate-assembly-overhang
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=golden-gate-assembly-overhang-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
